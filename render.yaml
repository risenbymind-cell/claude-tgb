# One-click deploy on Render.
#
#   1. Fork or push this repo to your own GitHub account
#   2. render.com → New → Blueprint → pick the repo
#   3. Paste your Telegram bot token and user ID when prompted
#   4. Deploy
#
# No server, no SSH, no commands. MASTER_KEY is generated by Render and never
# leaves it. The disk keeps your database and recordings across redeploys —
# without it, every deploy would wipe the trade ledger the risk caps are
# enforced from.

services:
  - type: worker
    name: directionalbot
    runtime: python
    plan: starter          # a free instance sleeps; a trading bot must not
    region: ohio           # closest Render region to Kalshi's Chicago matching
    buildCommand: pip install -r requirements.txt
    startCommand: python -m kbot
    autoDeploy: true
    disk:
      name: kbot-data
      mountPath: /var/data
      sizeGB: 5            # ~25 MB/day of recordings, so months of headroom
    envVars:
      # --- you supply these two ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # prompted on deploy, stored as a secret
      - key: ADMIN_IDS
        sync: false        # your Telegram user ID, from @userinfobot

      # --- generated for you ---
      - key: MASTER_KEY
        generateValue: true   # Render generates it; the app derives a Fernet
                              # key from it deterministically

      # --- sensible defaults ---
      - key: DB_PATH
        value: /var/data/kbot.sqlite3
      - key: KALSHI_DEMO
        value: "false"
      - key: PAYMENT_PROVIDER
        value: manual
      - key: RESULTS_POST_LOSSES
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

  # The web desk. A `web` service rather than a worker, so Render gives it a
  # public HTTPS URL and terminates TLS for it.
  #
  # DESK_PASSWORD is prompted on deploy and stored as a secret. Without it the
  # desk refuses to bind a public port and the deploy fails its health check —
  # that refusal is the point: this port can place trades.
  - type: web
    name: directionalbot-desk
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python -m kbot.webui --host 0.0.0.0
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: kbot-desk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DESK_PASSWORD
        sync: false        # prompted on deploy; at least 12 characters
      - key: MASTER_KEY
        generateValue: true
      - key: DESK_TRUST_PROXY
        value: "1"         # Render terminates TLS and forwards
      - key: DB_PATH
        value: /var/data/desk.sqlite3
      - key: TRADING_MODE
        value: paper       # raise this deliberately, not by default
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Separate service so market data keeps accumulating whether or not the bot
  # is trading, and a bot redeploy never interrupts a recording. This is what
  # makes the profitability question answerable in ~2 weeks.
  - type: worker
    name: directionalbot-recorder
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python -m kbot.research --dir /var/data/recordings record --interval 1
    autoDeploy: true
    disk:
      name: kbot-recordings
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MASTER_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/recorder.sqlite3
      - key: KALSHI_DEMO
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
