<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eff1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1116" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Aether Desk</title>
<style>
:root{
  --paper:#eff1f4;--surface:#fff;
  --ink:#10161f;--ink-2:#515c6b;--ink-3:#7d8899;
  --rule:#d5dae1;--rule-soft:#e2e6eb;
  --accent:#b4610a;--accent-soft:rgba(180,97,10,.10);--on-accent:#fff;
  --down:#a6353f;--warn:#a15c00;
  --shadow:0 1px 2px rgba(16,22,31,.05),0 8px 24px rgba(16,22,31,.05);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1116;--surface:#141b23;
  --ink:#e6eaf0;--ink-2:#94a1b2;--ink-3:#6b7889;
  --rule:#232d38;--rule-soft:#1b232c;
  --accent:#e8a13a;--accent-soft:rgba(232,161,58,.12);--on-accent:#0c1116;
  --down:#e0707c;--warn:#e8a13a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0c1116;--surface:#141b23;
  --ink:#e6eaf0;--ink-2:#94a1b2;--ink-3:#6b7889;
  --rule:#232d38;--rule-soft:#1b232c;
  --accent:#e8a13a;--accent-soft:rgba(232,161,58,.12);--on-accent:#0c1116;
  --down:#e0707c;--warn:#e8a13a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:400px;background:var(--surface);
  border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);padding:28px 26px;
}
.brand{
  font:600 15px/1 var(--mono);text-transform:uppercase;letter-spacing:-.01em;
  margin:0 0 4px;
}
.brand .dot{color:var(--accent)}
.sub{color:var(--ink-3);font-size:12.5px;margin:0 0 22px}
label{
  display:block;font:500 10px/1 var(--mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;
}
input[type=password]{
  width:100%;font:500 16px var(--sans);padding:11px 12px;
  border-radius:6px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink);
}
input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{
  width:100%;margin-top:14px;font:600 15px var(--sans);padding:12px 16px;
  border-radius:6px;cursor:pointer;border:1px solid transparent;
  background:var(--ink);color:var(--paper);
}
button:hover{background:var(--accent);color:var(--on-accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{
  background:color-mix(in srgb,var(--down) 12%,transparent);
  border:1px solid var(--down);color:var(--ink);
  border-radius:6px;padding:9px 11px;font-size:13px;margin:0 0 16px;
}
.note{
  margin:20px 0 0;padding-top:16px;border-top:1px solid var(--rule-soft);
  color:var(--ink-3);font-size:11.5px;line-height:1.5;
}
@supports (padding: max(0px)){
  body{
    padding-left:max(24px,env(safe-area-inset-left));
    padding-right:max(24px,env(safe-area-inset-right));
  }
}
</style>
</head>
<body>
  <main class="card">
    <h1 class="brand">Aether<span class="dot">.</span>desk</h1>
    <p class="sub">Sign in to reach the trading desk.</p>

    <!--ERROR-->

    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" autofocus required>
      <button type="submit">Sign in</button>
    </form>

    <p class="note">This desk can hold Kalshi credentials and place orders.
    Failed attempts are rate-limited and recorded in the audit log.</p>
  </main>
</body>
</html>
