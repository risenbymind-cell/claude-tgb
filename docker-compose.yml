services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # Mount the platform market-data key read-only if you use one.
      - ./secrets:/app/secrets:ro
    ports:
      # Only needed for payment callbacks and /healthz. Put a TLS proxy in
      # front of this — see deploy/Caddyfile.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
